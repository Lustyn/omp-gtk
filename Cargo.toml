[package]
name = "omp-gtk"
version = "0.1.0"
description = "Native GTK desktop frontend for omp"
edition = "2024"
license = "MIT"
readme = "README.md"

[dependencies]
async-channel = "2.5.0"
base64 = "0.23.1"
gdk-pixbuf = { version = "0.22.0", features = ["v2_40"] }
gtk4 = { version = "0.11.4", features = ["v4_22"] }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
lucide-icons = "1.31.0"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
pango = { version = "0.22.8", features = ["v1_56"] }
pulldown-cmark = "0.13.0"
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
ratex-types = "0.1.14"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "vorbis", "wav"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
simple-icons-pack = "16.28.0"
ureq = "3.1.2"
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFURL"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["CTFontManager"] }

[features]
ui-stories = []

[[bin]]
name = "ui-gallery"
path = "src/bin/ui_gallery.rs"
required-features = ["ui-stories"]

[build-dependencies]
glib-build-tools = "0.22.0"
