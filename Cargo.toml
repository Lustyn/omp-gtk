[package]
name = "omp-native"
version = "0.1.0"
description = "Native desktop client for Oh My Pi"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
base64 = "0.23.1"
gtk4 = { version = "0.11.4", features = ["v4_22"] }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
lucide-icons = "1.31.0"
pulldown-cmark = "0.13.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "vorbis", "wav"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
simple-icons-pack = "16.28.0"
ureq = "3.1.2"
url = "2.5.8"
yeslogic-fontconfig-sys = "6.0.1"

[features]
ui-stories = []

[[bin]]
name = "ui-gallery"
path = "src/bin/ui_gallery.rs"
required-features = ["ui-stories"]

[build-dependencies]
glib-build-tools = "0.22.0"
